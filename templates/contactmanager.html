<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactManager</title>
    <link rel= "stylesheet" href = "../static/notestyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: gray;">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Contact Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/home">Home</a>
        </li>

        </li>
      </ul>
    </div>
  </div>
</nav>


    <div style=" display: flex; justify-content: center;">
        <div class = titlebox style>
            <h1 class="display-1" style="color: white;">Contact Manager</h1>

        </div>
    </div>


    <div class="card" style="width: 58rem; display: flex; justify-content:  center; flex-direction: column; margin-left: 24%;">
        <form action="/home" method = "post">
            <div class="card-body" >
                <h5 class="card-title" style="margin-left: 40%;" >NEW CONTACT</h5>
                <p class="card-text" style="margin-left: 34% "; >Put their full name & phone number.</p>
            </div>

            <ul class="list-group list-group-flush">
                <div style = "display: flex;">
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="inputGroup-sizing-default">FULL NAME: </span>
                        <input type="firstname" name="name" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
                    </div>
                    
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="inputGroup-sizing-default">PHONE NUMBER:</span>
                    <input type="phonenumber" name="phone" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
                </div>
            </ul>

            <div class="card-body">
            <button type="submit" class="btn btn-primary">SUBMIT</button>
            </div>
        </form>
    </div>

    <p class="fs-2" style="margin-left: 46%; margin-top: 25px;">CONTACTS</p>
    <div style="display: flex; flex-wrap: wrap; max-width: 1300px; margin-left: 300px;">
        {% for c in contacts %}
            <div class="card" style="width: 18rem; background-color:rgb(0, 0, 0); margin-left: 20px; margin-top: 50px;">
            <!-- <img src="..." class="card-img-top" alt="..."> -->
            <div class="card-body">
                <a href="/delete/{{c._id}}">
                <button type="button" class="btn-close" disabled aria-label="Close" style="background-color: red; color: white; margin-left: 95%;"></button>
                </a>
                <h5 class="card-title" style="color: white; ;">{{c.Name}}</h5>
                <p class="card-text" style="color: whitesmoke;">{{c.Contact}}</p>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-name= {{c.Name}} data-bs-number= {{c.Contact}} data-bs-id = {{c._id}}>✎</button>

                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">✎</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form action="/update/{{c._id}}" method="post">
                    <div class="modal-body">
                            <input type="hidden" id="contactID">
                        <div class="mb-3">
                            <label for="name" class="col-form-label">Name:</label>
                            <input type="text" class="form-control" id="name" name = "updateduser">
                        </div>
                        <div class="mb-3">
                            <label for="contact" class="col-form-label">Contact:</label>
                            <input class="form-control" id="contact" name = "updatedcontact">
                        </div>
                        
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Update</button>              
                    </div>
                    </form>
                    </div>
                </div>
                </div>
            </div>
            </div>
        {% endfor %}

    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
const exampleModal = document.getElementById('exampleModal')
if (exampleModal) {
  exampleModal.addEventListener('show.bs.modal', event => {
    const button = event.relatedTarget
    const name = button.getAttribute('data-bs-name')
    const contact = button.getAttribute('data-bs-number')
    const id = button.getAttribute('data-bs-id')

    document.getElementById("name").value = name
    document.getElementById("contact").value = contact
    document.getElementById("contactID").value = id
  })
}
</script>
</body>

</html>
